name: pm2.5 forcast

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 07:00 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm2-5-forcast
  cancel-in-progress: false

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TIMEZONE: Asia/Bangkok
      RANDOM_STATE: "42"
      FIREBASE_RTD_URL: ${{ secrets.FIREBASE_RTD_URL }}
      FIREBASE_AUTH: ${{ secrets.FIREBASE_AUTH }}
      FIREBASE_PATH: /AirQuality/Log
      FIREBASE_PATH_CANDIDATES: /AirQuality/Log,/air_quality_readings,/AirQuality,/
      USE_LOCAL_FALLBACK: "true"
      LOCAL_FALLBACK_PATH: data/iot_2023.csv
      MERGE_LOCAL_WITH_FIREBASE: "true"
      MODELS_DIR: models
      PUSH_FORECAST_TO_FIREBASE: "true"
      FIREBASE_FORECAST_PATH: /predictions/next_day.json
      FIREBASE_PREVIOUS_DAY_PATH: /predictions/previous_day.json
      FIREBASE_HISTORY_BASE_PATH: /predictions/history

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Validate required secrets
        run: |
          if [ -z "${FIREBASE_RTD_URL}" ]; then
            if [ "${USE_LOCAL_FALLBACK}" = "true" ]; then
              echo "::warning::Missing FIREBASE_RTD_URL secret; using local fallback dataset and disabling Firebase push"
              echo "PUSH_FORECAST_TO_FIREBASE=false" >> "$GITHUB_ENV"
            else
              echo "::error::Missing FIREBASE_RTD_URL secret and USE_LOCAL_FALLBACK is not true"
              exit 1
            fi
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Normalize local fallback schema
        run: |
          if [ -z "${FIREBASE_RTD_URL}" ] && [ "${USE_LOCAL_FALLBACK}" = "true" ]; then
            python -c "from pathlib import Path; import os, pandas as pd; src=os.getenv('LOCAL_FALLBACK_PATH','').strip(); p=Path(src) if src else None; assert src and p and p.exists(), f'LOCAL_FALLBACK_PATH not found or empty: {src}'; df=pd.read_csv(p); cols={str(c).strip(): c for c in df.columns}; df=df.rename(columns={cols['at_time']:'time'}) if 'time' not in cols and 'at_time' in cols else df; cols={str(c).strip(): c for c in df.columns}; df=df.rename(columns={cols['timestamp']:'time'}) if 'time' not in cols and 'timestamp' in cols else df; assert 'time' in df.columns, 'Fallback file has no usable timestamp column (expected time/at_time/timestamp)'; out=Path('data')/'ci_local_fallback_normalized.csv'; out.parent.mkdir(parents=True, exist_ok=True); df.to_csv(out, index=False); print(f'Wrote normalized fallback: {out}')"
            echo "LOCAL_FALLBACK_PATH=data/ci_local_fallback_normalized.csv" >> "$GITHUB_ENV"
          fi

      - name: Execute latest notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute train_pm_colab_firebase.ipynb \
            --output train_pm_colab_firebase.executed.ipynb \
            --ExecutePreprocessor.timeout=1800 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forecast-run-artifacts
          path: |
            train_pm_colab_firebase.executed.ipynb
            models/forecast_next_day.json
            models/training_metadata_colab_firebase.json
          if-no-files-found: warn
